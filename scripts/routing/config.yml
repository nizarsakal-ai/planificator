graphhopper:
  datareader.file: france-latest.osm.pbf
  graph.location: france-graph
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
  profiles_ch:
    - profile: car
  profiles_lm: []
  graph.encoded_values: car_access, car_average_speed, road_access
  import.osm.ignored_highways: footway,construction,cycleway,path,steps
  graph.dataaccess.default_type: RAM_STORE
  prepare.ch.threads: 2
  prepare.subnetworks.threads: 2
  routing.max_visited_nodes: 1000000
  routing.timeout_ms: 4000
  datareader.preferred_language: fr
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  level: INFO
  appenders:
    - type: console
